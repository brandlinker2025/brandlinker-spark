<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Spark Orders (private)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #070A1F; color: #F7F5FF; margin: 0; padding: 24px; }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-weight: 600; font-size: 1.4rem; }
    p, label { color: rgba(247,245,255,0.75); }
    input { padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(214,218,245,0.3); background: #0B0F2B; color: #F7F5FF; width: min(320px, 100%); }
    button { margin-top: 10px; padding: 8px 16px; border-radius: 999px; border: 0; background: #FF5CA8; color: #070A1F; font-weight: 600; cursor: pointer; }
    pre { background: #0B0F2B; border: 1px solid rgba(214,218,245,0.18); border-radius: 12px; padding: 14px; overflow: auto; white-space: pre-wrap; }
    .err { color: #FFB3D4; }
  </style>
</head>
<body>
  <main>
    <h1>BrandLinker Spark orders</h1>
    <p>Private list of saved orders. Enter the admin secret to view them.</p>
    <form id="f">
      <label for="secret">Admin secret</label><br />
      <input id="secret" type="password" autocomplete="off" required />
      <div><button type="submit">Load orders</button></div>
    </form>
    <p id="status"></p>
    <pre id="out" hidden></pre>
  </main>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const secret = document.getElementById("secret").value;
      const status = document.getElementById("status");
      const out = document.getElementById("out");
      status.textContent = "Loading…";
      status.className = "";
      try {
        const res = await fetch("/api/orders", { headers: { "X-Order-Admin-Secret": secret } });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Could not load orders.");
        status.textContent = data.count + " order(s) found.";
        out.hidden = false;
        out.textContent = JSON.stringify(data.orders, null, 2);
      } catch (err) {
        status.textContent = err.message || "Could not load orders.";
        status.className = "err";
        out.hidden = true;
      }
    });
  </script>
</body>
</html>
