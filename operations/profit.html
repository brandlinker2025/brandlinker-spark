<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Spark landed-cost calculator</title><style>body{background:#101521;color:#fff;font:16px system-ui}main{max-width:600px;margin:auto;padding:20px}label{display:block;margin:12px 0}input,button{display:block;width:100%;box-sizing:border-box;padding:12px;font:inherit;border-radius:8px}button{background:#e8c47c;margin-top:20px}pre{white-space:pre-wrap}</style><main><h1>Spark landed-cost calculator</h1><p>Product cost, shipping, duty, payment fees and return reserve. Use one currency throughout. Estimates only; no live quotes or orders.</p><form id="calc"><label>Cost<input id="cost" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Shipping<input id="shipping" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Duty<input id="duty" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Fees<input id="fees" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Reserve<input id="reserve" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><label>Price<input id="price" type="number" min="0" max="1000000000" step="0.01" required value="0"></label><button>Calculate</button></form><pre id="result" aria-live="polite"></pre></main><script src="calculator.js" defer></script></html>
